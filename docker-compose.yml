services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terramind
      POSTGRES_USER: terramind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terramind -d terramind"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://terramind:${POSTGRES_PASSWORD}@db:5432/terramind
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ENVIRONMENT: production
      REPORT_STORAGE_DIR: /var/lib/terramind/reports
      PERSIST_ANALYSIS_JOBS: "true"
      MONITORING_SCHEDULER_ENABLED: "true"
      GEE_PROJECT: ${GEE_PROJECT:-}
      GEE_AUTH_MODE: ${GEE_AUTH_MODE:-service_account}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      GEE_PRIVATE_KEY_FILE: ${GEE_PRIVATE_KEY_FILE:-/run/secrets/earth-engine-service-account.json}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
    volumes:
      - reports:/var/lib/terramind/reports
      - ${GEE_KEY_HOST_PATH:-./secrets/earth-engine-service-account.json}:/run/secrets/earth-engine-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_TYPE: ${VITE_GOOGLE_MAPS_MAP_TYPE:-satellite}
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  reports:
